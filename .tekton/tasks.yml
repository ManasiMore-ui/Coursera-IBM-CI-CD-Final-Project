apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
  labels:
    app.kubernetes.io/part-of: cicd-pipeline
  annotations:
    description: "Clean the designated workspace before preparing the source code."
spec:
  workspaces:
    - name: source
  steps:
    - name: cleanup-workspace
      image: alpine:3.20
      securityContext:
        allowPrivilegeEscalation: false
      script: |
        #!/bin/sh
        set -eu

        echo "Starting workspace cleanup..."

        if [ ! -d "$(workspaces.source.path)" ]; then
          echo "ERROR: Source workspace does not exist."
          exit 1
        fi

        find "$(workspaces.source.path)" \
          -mindepth 1 \
          -maxdepth 1 \
          -exec rm -rf -- {} +

        echo "Workspace cleanup completed successfully."

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nose-test
  labels:
    app.kubernetes.io/part-of: cicd-pipeline
  annotations:
    description: "Install project dependencies and execute Python unit tests."
spec:
  workspaces:
    - name: source
  steps:
    - name: install-dependencies
      image: python:3.11-slim
      workingDir: $(workspaces.source.path)
      securityContext:
        allowPrivilegeEscalation: false
      script: |
        #!/bin/sh
        set -eu

        echo "Preparing Python test environment..."

        python -m pip install --disable-pip-version-check nose

        if [ -f requirements.txt ]; then
          python -m pip install --disable-pip-version-check -r requirements.txt
        fi

        echo "Python test dependencies installed successfully."

    - name: execute-unit-tests
      image: python:3.11-slim
      workingDir: $(workspaces.source.path)
      securityContext:
        allowPrivilegeEscalation: false
      script: |
        #!/bin/sh
        set -eu

        echo "Running Python unit tests with nose..."

        nosetests --verbosity=2

        echo "Unit tests completed successfully."
